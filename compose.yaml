services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: minitrack-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: minitrack-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
